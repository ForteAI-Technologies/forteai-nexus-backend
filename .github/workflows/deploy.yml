name: Backend Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Get code from GitHub repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Install required tools for deployment
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync jq

      # Step 3: Setup SSH key for Bastion server
      - name: Setup SSH Key for Bastion
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BASTION_SSH_KEY }}" > ~/.ssh/cicd_key
          chmod 600 ~/.ssh/cicd_key
          ssh-keyscan ${{ vars.BASTION_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      # Step 4: Prepare temporary deployment directory on Bastion
      - name: Prepare Bastion Directory
        run: |
          ssh -i ~/.ssh/cicd_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BASTION_IP }} "mkdir -p /tmp/backend-deploy && rm -rf /tmp/backend-deploy/*"

      # Step 5: Copy backend code to Bastion
      - name: Copy Code to Bastion
        run: |
          rsync -avz -e "ssh -i ~/.ssh/cicd_key -o StrictHostKeyChecking=no" --exclude='.git' --exclude='node_modules' --exclude='*.log' ./ ec2-user@${{ vars.BASTION_IP }}:/tmp/backend-deploy/

      # Step 6: Create environment file on Bastion (backend secrets from GitHub)
      - name: Create Environment File
        run: |
          ssh -i ~/.ssh/cicd_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BASTION_IP }} "
            echo 'DB_HOST=${{ secrets.DB_HOST }}' > /tmp/backend.env
            echo 'DB_USER=${{ secrets.DB_USER }}' >> /tmp/backend.env
            echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> /tmp/backend.env
            echo 'DB_NAME=${{ vars.DB_NAME }}' >> /tmp/backend.env
            echo 'JWT_SECRET=${{ secrets.JWT_SECRET }}' >> /tmp/backend.env
            echo 'PORT=${{ vars.PORT }}' >> /tmp/backend.env
            echo 'FLASK_HOST=${{ vars.FLASK_HOST }}' >> /tmp/backend.env
            echo 'FLASK_PORT=${{ vars.FLASK_PORT }}' >> /tmp/backend.env
            echo 'EMAIL_USER=${{ secrets.EMAIL_USER }}' >> /tmp/backend.env
            echo 'EMAIL_FROM=${{ vars.EMAIL_FROM }}' >> /tmp/backend.env
            echo 'EMAIL_APP_PASSWORD=${{ secrets.EMAIL_APP_PASSWORD }}' >> /tmp/backend.env
            echo 'BACKEND_URL=${{ vars.BACKEND_URL }}' >> /tmp/backend.env
          "

      # Step 7: Create PM2 ecosystem config on Bastion
      - name: Create PM2 Ecosystem Config
        run: |
          ssh -i ~/.ssh/cicd_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BASTION_IP }} "
            cat > /tmp/ecosystem.config.js << 'EOFPM2'
          module.exports = {
            apps: [{
              name: 'nexus-backend',
              script: './server.js',
              instances: 1,
              exec_mode: 'fork',
              autorestart: true,
              watch: false,
              max_restarts: 10,
              min_uptime: '10s',
              env: {
                NODE_ENV: 'production',
                PORT: 3000
              },
              error_file: '/home/ec2-user/logs/nexus-backend-error.log',
              out_file: '/home/ec2-user/logs/nexus-backend-out.log',
              log_date_format: 'YYYY-MM-DD HH:mm:ss Z',
              max_memory_restart: '1G',
              kill_timeout: 5000,
              listen_timeout: 3000,
              wait_ready: true
            }]
          }
          EOFPM2
          "

      # Step 8: Backup current backend (Bastion → Backend)
      - name: Backup Current Backend
        run: |
          ssh -i ~/.ssh/cicd_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BASTION_IP }} "
            ssh -i ~/.ssh/backend_deploy_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BACKEND_SERVER_IP }} '
              if [ -d /home/ec2-user/forteai-nexus-backend ] && [ -n \"\$(ls -A /home/ec2-user/forteai-nexus-backend 2>/dev/null)\" ]; then
                BACKUP_DIR=\"/home/ec2-user/backend-backups/backup-\$(date +%Y%m%d_%H%M%S)\"
                mkdir -p \"\$BACKUP_DIR\"
                cp -r /home/ec2-user/forteai-nexus-backend/* \"\$BACKUP_DIR/\" 2>/dev/null || true
                cd /home/ec2-user/backend-backups && ls -t | tail -n +6 | xargs -r rm -rf
              fi
            '
          "

      # Step 9: Deploy code from Bastion → Backend
      - name: Deploy to Backend Server
        run: |
          ssh -i ~/.ssh/cicd_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BASTION_IP }} "
            ssh -i ~/.ssh/backend_deploy_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BACKEND_SERVER_IP }} 'mkdir -p /home/ec2-user/forteai-nexus-backend && mkdir -p /home/ec2-user/logs'
            
            rsync -avz -e 'ssh -i ~/.ssh/backend_deploy_key -o StrictHostKeyChecking=no' /tmp/backend-deploy/ ec2-user@${{ vars.BACKEND_SERVER_IP }}:/home/ec2-user/forteai-nexus-backend/
            
            scp -i ~/.ssh/backend_deploy_key -o StrictHostKeyChecking=no /tmp/backend.env ec2-user@${{ vars.BACKEND_SERVER_IP }}:/home/ec2-user/forteai-nexus-backend/.env
            
            scp -i ~/.ssh/backend_deploy_key -o StrictHostKeyChecking=no /tmp/ecosystem.config.js ec2-user@${{ vars.BACKEND_SERVER_IP }}:/home/ec2-user/forteai-nexus-backend/ecosystem.config.js
          "

      # Step 10: Install Node.js dependencies on backend
      - name: Install Dependencies
        run: |
          ssh -i ~/.ssh/cicd_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BASTION_IP }} "
            ssh -i ~/.ssh/backend_deploy_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BACKEND_SERVER_IP }} 'cd /home/ec2-user/forteai-nexus-backend && npm install'
          "

      # Step 11: Stop current backend process
      - name: Stop Current Backend
        run: |
          ssh -i ~/.ssh/cicd_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BASTION_IP }} "
            ssh -i ~/.ssh/backend_deploy_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BACKEND_SERVER_IP }} '
              pm2 stop nexus-backend 2>/dev/null || true
              pm2 delete nexus-backend 2>/dev/null || true
              sleep 2
              sudo fuser -k 3000/tcp 2>/dev/null || true
              sleep 2
            '
          "

      # Step 12: Start backend with PM2
      - name: Start Backend with PM2
        run: |
          ssh -i ~/.ssh/cicd_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BASTION_IP }} "
            ssh -i ~/.ssh/backend_deploy_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BACKEND_SERVER_IP }} 'cd /home/ec2-user/forteai-nexus-backend && pm2 start ecosystem.config.js && sleep 5 && pm2 save'
          "

      # Step 13: Verify Deployment
      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/cicd_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BASTION_IP }} "
            ssh -i ~/.ssh/backend_deploy_key -o StrictHostKeyChecking=no ec2-user@${{ vars.BACKEND_SERVER_IP }} '
              echo \"Checking PM2 process status...\"
              PM2_STATUS=\$(pm2 jlist 2>/dev/null | jq -r \".[0].pm2_env.status\" 2>/dev/null || echo \"not_found\")
              if [ \"\$PM2_STATUS\" != \"online\" ]; then
                echo \"ERROR: PM2 not online. Logs:\"
                pm2 logs nexus-backend --lines 30 --nostream
                exit 1
              fi
              echo \"PM2 process is online\"
              
              HTTP_CODE=\$(curl -s -o /dev/null -w \"%{http_code}\" http://localhost:3000/api/health 2>/dev/null || echo \"000\")
              if [ \"\$HTTP_CODE\" != \"200\" ]; then
                echo \"ERROR: Health check failed with HTTP code \$HTTP_CODE\"
                pm2 logs nexus-backend --lines 30 --nostream
                exit 1
              fi
              echo \"Health check passed (HTTP 200)\"
            '
          "

      # Step 14: Deployment summary
      - name: Deployment Summary
        if: always()
        run: |
          echo "=============================================="
          echo "Backend Deployment Pipeline - Summary"
          echo "=============================================="
          echo "Status: ${{ job.status }}"
          echo "Backend URL: ${{ vars.BACKEND_URL }}"
          echo "AI Server: ${{ vars.FLASK_HOST }}:${{ vars.FLASK_PORT }}"
          echo "Database: ${{ secrets.DB_HOST }}"
          echo "=============================================="
