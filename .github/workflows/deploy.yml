name: Backend Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install sshpass and rsync
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync

      - name: Prepare Bastion Directory
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "
            mkdir -p /tmp/backend-deploy
            rm -rf /tmp/backend-deploy/*
          "

      - name: Copy Backend Files to Bastion
        run: |
          sshpass -p "forteai@123" rsync -avz --exclude='.git' ./ ec2-user@13.204.190.46:/tmp/backend-deploy/ || {
            echo "Rsync failed, retrying..."
            sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "mkdir -p /tmp/backend-deploy"
            sshpass -p "forteai@123" rsync -avz --exclude='.git' ./ ec2-user@13.204.190.46:/tmp/backend-deploy/
          }

      - name: Copy Files from Bastion to Backend EC2
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "
            sshpass -p 'forteai@1234' ssh -o StrictHostKeyChecking=no ec2-user@10.0.157.0 '
              mkdir -p /home/ec2-user/forteai-nexus-backend
              sudo chown -R ec2-user:ec2-user /home/ec2-user/forteai-nexus-backend
              sudo chmod -R 755 /home/ec2-user/forteai-nexus-backend
              rm -rf /home/ec2-user/forteai-nexus-backend/*
            '
            sshpass -p 'forteai@1234' rsync -avz /tmp/backend-deploy/ ec2-user@10.0.157.0:/home/ec2-user/forteai-nexus-backend/
          "

      - name: Setup Environment File
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "
            cat > /tmp/.env << 'EOF'
DB_HOST=forte-ai-db.cpowuk2ao66s.ap-south-1.rds.amazonaws.com
DB_USER=admin
DB_PASSWORD=8Q1ste85Mhf3
DB_NAME=forteai_employees
JWT_SECRET=forteai-super-secure-jwt-secret-key-2025
PORT=3000
FLASK_HOST=10.10.10.10
FLASK_PORT=5000
EMAIL_USER=forteaitechnologies@gmail.com
EMAIL_FROM=ForteAI Nexus System <forteaitechnologies@gmail.com>
EMAIL_APP_PASSWORD=kcfu sxka pgax gxbd
BACKEND_URL=https://nexus-backend.forteai.in
EOF
            sshpass -p 'forteai@1234' scp -o StrictHostKeyChecking=no /tmp/.env ec2-user@10.0.157.0:/home/ec2-user/forteai-nexus-backend/.env
          "

      - name: Install Dependencies and Start Backend
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "
            sshpass -p 'forteai@1234' ssh -o StrictHostKeyChecking=no ec2-user@10.0.157.0 '
              cd /home/ec2-user/forteai-nexus-backend
              
              if ! command -v node >/dev/null 2>&1; then
                curl -fsSL https://rpm.nodesource.com/setup_18.x | sudo bash -
                sudo yum install -y nodejs
              fi
              
              if ! command -v pm2 >/dev/null 2>&1; then
                sudo npm install -g pm2
              fi
              
              npm install
              
              pm2 stop nexus-backend || true
              pm2 delete nexus-backend || true
              pm2 start server.js --name nexus-backend
              pm2 save
              
              pm2 status
            '
          "

      - name: Verify Deployment
        run: |
          echo "Backend deployed successfully"
          echo "URL: https://nexus-backend.forteai.in"
