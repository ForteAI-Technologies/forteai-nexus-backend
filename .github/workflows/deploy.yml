name: Backend Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2️⃣ Install sshpass and rsync
      - name: Install sshpass and rsync
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync

      # 3️⃣ Ensure Bastion deploy directory exists
      - name: Prepare Bastion Directory
        run: |
          echo "🧹 Preparing Bastion directory..."
          sshpass -p 'forteai@123' ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "
            mkdir -p /tmp/backend-deploy
            rm -rf /tmp/backend-deploy/*
          "

      # 4️⃣ Copy backend repo files to Bastion
      - name: Copy Backend Files to Bastion
        run: |
          echo "📦 Copying files to Bastion..."
          sshpass -p 'forteai@123' rsync -avz --exclude='.git' --exclude='node_modules' --exclude='.env' ./ ec2-user@13.204.190.46:/tmp/backend-deploy/

      # 5️⃣ Copy files from Bastion to Backend EC2
      - name: Copy Files from Bastion to Backend EC2
        run: |
          echo "📤 Copying files to Backend server..."
          sshpass -p 'forteai@123' ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "
            sshpass -p 'forteai@1234' ssh -o StrictHostKeyChecking=no ec2-user@10.0.157.0 '
              mkdir -p /home/ec2-user/forteai-nexus-backend
              sudo chown -R ec2-user:ec2-user /home/ec2-user/forteai-nexus-backend
              
              # Backup .env if exists
              if [ -f /home/ec2-user/forteai-nexus-backend/.env ]; then
                cp /home/ec2-user/forteai-nexus-backend/.env /home/ec2-user/forteai-nexus-backend/.env.backup
              fi
              
              # Remove old code except .env backup
              find /home/ec2-user/forteai-nexus-backend -mindepth 1 ! -name \".env.backup\" -delete
            '
            
            echo \"📋 Copying new code...\"
            sshpass -p 'forteai@1234' rsync -avz /tmp/backend-deploy/ ec2-user@10.0.157.0:/home/ec2-user/forteai-nexus-backend/
          "

      # 6️⃣ Create .env file
      - name: Setup Environment File
        run: |
          echo "🔐 Creating .env file..."
          sshpass -p 'forteai@123' ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "
            sshpass -p 'forteai@1234' ssh -o StrictHostKeyChecking=no ec2-user@10.0.157.0 '
              cd /home/ec2-user/forteai-nexus-backend
              
              cat > .env << \"EOF\"
# RDS Credentials
DB_HOST=forte-ai-db.cpowuk2ao66s.ap-south-1.rds.amazonaws.com
DB_USER=admin
DB_PASSWORD=8Q1ste85Mhf3
DB_NAME=forteai_employees

# JWT Secret
JWT_SECRET=forteai-super-secure-jwt-secret-key-2025

# Server Configuration
PORT=3000

# Flask/AI Server
FLASK_HOST=10.10.10.10
FLASK_PORT=5000

# Email Configuration
EMAIL_USER=forteaitechnologies@gmail.com
EMAIL_FROM=ForteAI Nexus System <forteaitechnologies@gmail.com>
EMAIL_APP_PASSWORD=kcfu sxka pgax gxbd

# Backend URL
BACKEND_URL=https://nexus-backend.forteai.in
EOF
              
              chmod 600 .env
              echo \"✅ .env created\"
            '
          "
          
      # 7️⃣ Install dependencies & start with PM2
      - name: Deploy Backend with PM2
        run: |
          echo "🚀 Deploying backend..."
          sshpass -p 'forteai@123' ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "
            sshpass -p 'forteai@1234' ssh -o StrictHostKeyChecking=no ec2-user@10.0.157.0 '
              cd /home/ec2-user/forteai-nexus-backend

              # Check Node.js
              if ! command -v node >/dev/null 2>&1; then
                echo \"Installing Node.js...\"
                curl -fsSL https://rpm.nodesource.com/setup_18.x | sudo bash -
                sudo yum install -y nodejs
              fi

              # Check PM2
              if ! command -v pm2 >/dev/null 2>&1; then
                echo \"Installing PM2...\"
                sudo npm install -g pm2
              fi

              # Install dependencies
              echo \"📦 Installing dependencies...\"
              npm install --production

              # Restart with PM2
              echo \"🔄 Restarting backend...\"
              pm2 stop nexus-backend 2>/dev/null || true
              pm2 delete nexus-backend 2>/dev/null || true
              pm2 start server.js --name nexus-backend
              pm2 save
              
              # Setup startup
              sudo env PATH=\$PATH:/usr/bin pm2 startup systemd -u ec2-user --hp /home/ec2-user 2>/dev/null || true

              echo \"✅ Backend deployed successfully\"
              pm2 status
            '
          "

      # 8️⃣ Verify Deployment
      - name: Verify Deployment
        run: |
          echo "✅ Deployment completed!"
          echo "🔗 Backend: https://nexus-backend.forteai.in"
