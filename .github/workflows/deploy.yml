name: Backend Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install sshpass and rsync
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync

      - name: Prepare Bastion Directory
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "mkdir -p /tmp/backend-deploy && rm -rf /tmp/backend-deploy/*"

      - name: Copy Backend Files to Bastion
        run: |
          sshpass -p "forteai@123" rsync -avz --exclude='.git' --exclude='node_modules' ./ ec2-user@13.204.190.46:/tmp/backend-deploy/

      - name: Copy Files from Bastion to Backend EC2
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "sshpass -p 'forteai@1234' ssh -o StrictHostKeyChecking=no ec2-user@10.0.157.0 'mkdir -p /home/ec2-user/forteai-nexus-backend && sudo chown -R ec2-user:ec2-user /home/ec2-user/forteai-nexus-backend && sudo chmod -R 755 /home/ec2-user/forteai-nexus-backend && rm -rf /home/ec2-user/forteai-nexus-backend/*' && sshpass -p 'forteai@1234' rsync -avz /tmp/backend-deploy/ ec2-user@10.0.157.0:/home/ec2-user/forteai-nexus-backend/"

      - name: Create Env File on Bastion
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "echo 'DB_HOST=forte-ai-db.cpowuk2ao66s.ap-south-1.rds.amazonaws.com' > /tmp/backend.env && echo 'DB_USER=admin' >> /tmp/backend.env && echo 'DB_PASSWORD=8Q1ste85Mhf3' >> /tmp/backend.env && echo 'DB_NAME=forteai_employees' >> /tmp/backend.env && echo 'JWT_SECRET=forteai-super-secure-jwt-secret-key-2025' >> /tmp/backend.env && echo 'PORT=3000' >> /tmp/backend.env && echo 'FLASK_HOST=10.10.10.10' >> /tmp/backend.env && echo 'FLASK_PORT=5000' >> /tmp/backend.env && echo 'EMAIL_USER=forteaitechnologies@gmail.com' >> /tmp/backend.env && echo 'EMAIL_FROM=ForteAI Nexus System <forteaitechnologies@gmail.com>' >> /tmp/backend.env && echo 'EMAIL_APP_PASSWORD=kcfu sxka pgax gxbd' >> /tmp/backend.env && echo 'BACKEND_URL=https://nexus-backend.forteai.in' >> /tmp/backend.env"

      - name: Copy Env File to Backend
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "sshpass -p 'forteai@1234' scp -o StrictHostKeyChecking=no /tmp/backend.env ec2-user@10.0.157.0:/home/ec2-user/forteai-nexus-backend/.env"

      - name: Install Dependencies and Start Backend
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "sshpass -p 'forteai@1234' ssh -o StrictHostKeyChecking=no ec2-user@10.0.157.0 'cd /home/ec2-user/forteai-nexus-backend && if ! command -v node >/dev/null 2>&1; then curl -fsSL https://rpm.nodesource.com/setup_18.x | sudo bash - && sudo yum install -y nodejs; fi && if ! command -v pm2 >/dev/null 2>&1; then sudo npm install -g pm2; fi && npm install && pm2 stop nexus-backend 2>/dev/null || true && pm2 delete nexus-backend 2>/dev/null || true && pm2 start server.js --name nexus-backend && pm2 save && pm2 status'"

      - name: Verify Deployment
        run: |
          echo "Backend deployed successfully"
          echo "URL: https://nexus-backend.forteai.in"
