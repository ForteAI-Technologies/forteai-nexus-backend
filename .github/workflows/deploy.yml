name: Backend Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync jq

      - name: Prepare Bastion Directory
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "mkdir -p /tmp/backend-deploy && rm -rf /tmp/backend-deploy/*"

      - name: Copy Backend Files to Bastion
        run: |
          sshpass -p "forteai@123" rsync -avz --exclude='.git' --exclude='node_modules' --exclude='*.log' --exclude='*.backup*' ./ ec2-user@13.204.190.46:/tmp/backend-deploy/

      - name: Create Environment File
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "echo 'DB_HOST=forte-ai-db.cpowuk2ao66s.ap-south-1.rds.amazonaws.com' > /tmp/backend.env && echo 'DB_USER=admin' >> /tmp/backend.env && echo 'DB_PASSWORD=8Q1ste85Mhf3' >> /tmp/backend.env && echo 'DB_NAME=forteai_employees' >> /tmp/backend.env && echo 'JWT_SECRET=forteai-super-secure-jwt-secret-key-2025' >> /tmp/backend.env && echo 'PORT=3000' >> /tmp/backend.env && echo 'FLASK_HOST=10.0.135.215' >> /tmp/backend.env && echo 'FLASK_PORT=5000' >> /tmp/backend.env && echo 'EMAIL_USER=forteaitechnologies@gmail.com' >> /tmp/backend.env && echo 'EMAIL_FROM=ForteAI Nexus System <forteaitechnologies@gmail.com>' >> /tmp/backend.env && echo 'EMAIL_APP_PASSWORD=kcfu sxka pgax gxbd' >> /tmp/backend.env && echo 'BACKEND_URL=https://nexus-backend.forteai.in' >> /tmp/backend.env"

      - name: Create PM2 Ecosystem File
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "cat > /tmp/ecosystem.config.js << 'EOF'
          module.exports = {
            apps: [{
              name: 'nexus-backend',
              script: './server.js',
              instances: 1,
              exec_mode: 'fork',
              autorestart: true,
              watch: false,
              max_restarts: 10,
              min_uptime: '10s',
              env: { NODE_ENV: 'production', PORT: 3000 },
              error_file: '/home/ec2-user/logs/nexus-backend-error.log',
              out_file: '/home/ec2-user/logs/nexus-backend-out.log',
              log_date_format: 'YYYY-MM-DD HH:mm:ss Z',
              max_memory_restart: '1G',
              kill_timeout: 5000,
              listen_timeout: 3000,
              wait_ready: true
            }]
          }
          EOF
          "

      - name: Backup Current Backend
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "sshpass -p 'forteai@1234' ssh -o StrictHostKeyChecking=no ec2-user@10.0.157.0 'if [ -d /home/ec2-user/forteai-nexus-backend ]; then BACKUP_DIR=/home/ec2-user/backend-backups/backup-\$(date +%Y%m%d_%H%M%S); mkdir -p \$BACKUP_DIR; cp -r /home/ec2-user/forteai-nexus-backend/* \$BACKUP_DIR/ 2>/dev/null || true; fi'"

      - name: Deploy to Backend Server
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "sshpass -p 'forteai@1234' ssh -o StrictHostKeyChecking=no ec2-user@10.0.157.0 'mkdir -p /home/ec2-user/forteai-nexus-backend && mkdir -p /home/ec2-user/logs' && sshpass -p 'forteai@1234' rsync -avz /tmp/backend-deploy/ ec2-user@10.0.157.0:/home/ec2-user/forteai-nexus-backend/ && sshpass -p 'forteai@1234' scp /tmp/backend.env ec2-user@10.0.157.0:/home/ec2-user/forteai-nexus-backend/.env && sshpass -p 'forteai@1234' scp /tmp/ecosystem.config.js ec2-user@10.0.157.0:/home/ec2-user/forteai-nexus-backend/ecosystem.config.js"

      - name: Install Dependencies
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "sshpass -p 'forteai@1234' ssh -o StrictHostKeyChecking=no ec2-user@10.0.157.0 'cd /home/ec2-user/forteai-nexus-backend && if ! command -v node >/dev/null 2>&1; then curl -fsSL https://rpm.nodesource.com/setup_18.x | sudo bash - && sudo yum install -y nodejs; fi && if ! command -v pm2 >/dev/null 2>&1; then sudo npm install -g pm2; fi && npm install --production'"

      - name: Stop Current Backend
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "sshpass -p 'forteai@1234' ssh -o StrictHostKeyChecking=no ec2-user@10.0.157.0 'cd /home/ec2-user/forteai-nexus-backend && pm2 stop nexus-backend 2>/dev/null || true && pm2 delete nexus-backend 2>/dev/null || true && sleep 2 && sudo fuser -k 3000/tcp 2>/dev/null || true'"

      - name: Start Backend with PM2
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "sshpass -p 'forteai@1234' ssh -o StrictHostKeyChecking=no ec2-user@10.0.157.0 'cd /home/ec2-user/forteai-nexus-backend && pm2 start ecosystem.config.js && sleep 5 && pm2 save'"

      - name: Verify Backend Status
        run: |
          sshpass -p "forteai@123" ssh -o StrictHostKeyChecking=no ec2-user@13.204.190.46 "sshpass -p 'forteai@1234' ssh -o StrictHostKeyChecking=no ec2-user@10.0.157.0 'pm2 list && sleep 3 && curl -s http://localhost:3000/api/health || echo Failed'"

      - name: Deployment Summary
        if: always()
        run: |
          echo "Backend deployed to https://nexus-backend.forteai.in"
